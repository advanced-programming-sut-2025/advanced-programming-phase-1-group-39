// این کد باید در فایل "your-project-root/server/build.gradle" باشد

// پلاگین‌های لازم برای سرور
apply plugin: 'java-library'
apply plugin: 'application'

// این خط به Gradle می‌گوید که نقطه شروع برنامه سرور شما کجاست
mainClassName = 'com.StardewValley.server.ServerLauncher'
application.setMainClass(mainClassName)

// وابستگی‌های (dependencies) این ماژول
dependencies {
  // 1. سرور به کدهای مشترک (مدل‌ها و...) نیاز دارد
  implementation project(':core')

  // 2. <<-- وابستگی کلیدی به gdx-headless -->>
  // این خط از متغیر gdxVersion که در فایل build.gradle ریشه تعریف شده، استفاده می‌کند

  implementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
  // اگر از Box2D، FreeType یا هر ماژول دیگری در core استفاده می‌کنید که نیاز به natives دارد،
  // باید ماژول backend-headless مربوط به آنها را اضافه کنید:
   api "com.badlogicgames.gdx:gdx-box2d-platform:$gdxVersion:natives-desktop" // فقط در صورت استفاده
   api "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop" // فقط در صورت استفاده
}

sourceSets {
  main {
    resources {
      srcDir '../assets'
    }
  }
}

// این بخش یک فایل JAR قابل اجرا از سرور شما می‌سازد
// در فایل your-project-root/server/build.gradle
jar {
  archiveBaseName.set(appName + '-server')
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

  // <<--- این خط مهم است و مطمئن می‌شود که native libraries پک می‌شوند --->>
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }

  // این exclude ها را دوباره چک کنید، شاید اینها فایل gdx64.dll را حذف می‌کنند
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  // این exclude ها هم می‌تواند مشکل ساز باشد، آنها را موقتاً کامنت کنید
  // dependencies {
  //   exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  // }

  manifest {
    attributes 'Main-Class': project.mainClassName
  }
}